<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>BloodRide BD | Quick Links</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Import Main Website Styles -->
    <link rel="stylesheet" href="../style.css">
    
    <style>
        /* Minimal specific overrides for links page layout */
        body {
            background-color: var(--gray);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .links-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--white);
            padding: 4rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            text-align: center;
        }
        
        .header-logo-container {
            margin-bottom: 3rem;
        }
        
        .links-logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            color: var(--black);
            margin-bottom: 0.5rem;
        }
        
        .links-sub {
            font-size: 1.1rem;
            color: var(--dark-gray);
            font-weight: 500;
        }

        .link-stack {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        /* Override btn-large specifically for links page */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            text-decoration: none;
            /* Extra specific overriding just in case */
            padding: 1.25rem 1rem;
            font-size: 1rem;
        }
        
        .btn-link i {
            font-size: 1.25rem;
        }
        
        /* Custom Colors */
        .btn-whatsapp {
            background-color: #25D366;
            color: var(--white);
        }
        .btn-whatsapp:hover {
            background-color: #20bd5a;
        }
        
        .btn-social {
            background-color: var(--white);
            color: var(--black);
            border: 2px solid var(--gray);
        }
        .btn-social:hover {
            background-color: var(--gray);
            border-color: #e5e7eb;
        }
        
        .footer-text {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #a1a1aa;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <main class="links-wrapper">
        <div class="header-logo-container">
            <div class="links-logo"><span class="text-red">Blood</span>Ride BD</div>
            <p class="links-sub">Emergency Blood Logistics</p>
        </div>

        <div class="link-stack">
            <!-- 1. WhatsApp (Primary Highlight) -->
            <a href="https://wa.me/8801626332332" class="btn-large btn-link btn-whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-whatsapp"></i> MESSAGE ON WHATSAPP
            </a>

            <!-- 2. Main Website -->
            <a href="https://bloodridebd.com" class="btn-large btn-link bg-black text-white">
                <i class="fa-solid fa-globe"></i> VISIT WEBSITE
            </a>

            <!-- 3. Facebook -->
            <a href="https://www.facebook.com/share/17ju8tNsB8/" class="btn-large btn-link btn-social" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-facebook" style="color: #1877F2;"></i> FACEBOOK
            </a>

            <!-- 4. Instagram -->
            <a href="https://www.instagram.com/bloodride_bangladesh" class="btn-large btn-link btn-social" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-instagram" style="color: #E1306C;"></i> INSTAGRAM
            </a>
        </div>
        
        <div class="footer-text">
            &copy; 2026 BloodRide BD
        </div>
    </main>

</body>
</html>
